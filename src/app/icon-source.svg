<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#ff8200"/>

  <!-- Bone: black under-layer (knuckles + rounded shaft) then white
       over-layer, inset, for a bold outline with no internal seams -->
  <g fill="#000">
    <circle cx="104" cy="180" r="68"/>
    <circle cx="104" cy="332" r="68"/>
    <circle cx="408" cy="180" r="68"/>
    <circle cx="408" cy="332" r="68"/>
    <rect x="104" y="206" width="304" height="100" rx="20"/>
  </g>
  <g fill="#ffffff">
    <circle cx="104" cy="180" r="55"/>
    <circle cx="104" cy="332" r="55"/>
    <circle cx="408" cy="180" r="55"/>
    <circle cx="408" cy="332" r="55"/>
    <rect x="106" y="220" width="300" height="72" rx="14"/>
  </g>

  <!-- BD, bold and centered in the shaft -->
  <text x="256" y="282" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="94" fill="#1a1210">BD</text>
</svg>
