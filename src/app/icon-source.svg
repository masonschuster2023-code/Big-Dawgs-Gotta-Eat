<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#ff8200"/>

  <!-- Bone: black under-layer (four corner knobs + shaft, all black so they
       union with no seams) then a smaller white layer on top = bold outline -->
  <g fill="#000">
    <circle cx="108" cy="176" r="72"/>
    <circle cx="108" cy="336" r="72"/>
    <circle cx="404" cy="176" r="72"/>
    <circle cx="404" cy="336" r="72"/>
    <rect x="108" y="196" width="296" height="120"/>
  </g>
  <g fill="#ffffff">
    <circle cx="108" cy="176" r="58"/>
    <circle cx="108" cy="336" r="58"/>
    <circle cx="404" cy="176" r="58"/>
    <circle cx="404" cy="336" r="58"/>
    <rect x="110" y="214" width="292" height="84"/>
  </g>

  <!-- BD, bold and centered in the shaft -->
  <text x="256" y="292" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="900"
        font-size="108" fill="#1a1210" letter-spacing="-2">BD</text>
</svg>
