<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#ff8200"/>

  <!-- Bone: each end is two overlapping circles (top lobe + bottom lobe) —
       the concave pinch where they meet is the outer-tip notch, for free.
       Bar overlaps generously into both lobe clusters so the inner side
       reads as one continuous fill. Black under-layer + cream over-layer
       (inset) = bold outline. Widened vs. the first pass to land the
       2.5-3:1 width:height ratio while keeping the same notch depth ratio. -->
  <g fill="#2b1a0e">
    <circle cx="76" cy="219" r="57"/>
    <circle cx="76" cy="293" r="57"/>
    <circle cx="436" cy="219" r="57"/>
    <circle cx="436" cy="293" r="57"/>
    <rect x="115" y="221" width="282" height="70"/>
  </g>
  <g fill="#f5e6cc">
    <circle cx="76" cy="219" r="44"/>
    <circle cx="76" cy="293" r="44"/>
    <circle cx="436" cy="219" r="44"/>
    <circle cx="436" cy="293" r="44"/>
    <rect x="128" y="234" width="256" height="44"/>
  </g>

  <!-- BD, bold and centered in the bar -->
  <text x="256" y="272" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="56" fill="#2b1a0e">BD</text>
</svg>
