<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#ff8200"/>

  <!-- Bone built from capsule (stadium) shapes only — no straight-edge
       rectangle meeting a circle, so there's no sharp-corner seam anywhere.
       Black under-layer, white over-layer inset ~13px = bold outline. -->
  <g fill="#000">
    <rect x="43" y="142" width="130" height="228" rx="65"/>
    <rect x="339" y="142" width="130" height="228" rx="65"/>
    <rect x="100" y="208" width="312" height="96" rx="48"/>
  </g>
  <g fill="#ffffff">
    <rect x="56" y="155" width="104" height="202" rx="52"/>
    <rect x="352" y="155" width="104" height="202" rx="52"/>
    <rect x="113" y="221" width="286" height="70" rx="35"/>
  </g>

  <!-- BD, bold and centered in the shaft -->
  <text x="256" y="280" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="800"
        font-size="88" fill="#1a1210">BD</text>
</svg>
